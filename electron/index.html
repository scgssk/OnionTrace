<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>OnionTrace Analysis</title>
    <!-- Use Inter font for a clean, technical look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />

</head>

<body>

  <div class="header">
    <div class="title-group">
      <h1>OnionTrace</h1>
      <p id="meta">Network Forensics Intelligence Dashboard</p>
    </div>

    <div class="controls">
      <button id="pdf">Export PDF</button>
      <button id="export" class="secondary">Export JSON</button>
      <input type="file" id="pcap" accept=".pcap">
      <select id="mode">
        <option value="simulation">Simulation</option>
        <option value="realtime">Real-time (Dev)</option>
      </select>
      <button id="analyze">Analyze</button>
    </div>
  </div>

  <div class="workspace">

    <!-- RESULTS -->
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Guard</th>
            <th>Confidence</th>
            <th>Score</th>
            <th>Level</th>
            <th>Forensic Reasoning</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <!-- GRAPH -->
    <div class="card">
      <div class="graph-header">
        <h3 id="graph-title">Confidence Over Time</h3>
        <p id="graph-hint" class="text-muted">
          Select a guard to visualize confidence evolution
        </p>
      </div>
      <div class="graph-body">
        <canvas id="confidenceChart"></canvas>
      </div>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>


</html>
