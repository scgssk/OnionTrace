<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>OnionTrace Analysis</title>
    <!-- Use Inter font for a clean, technical look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            line-height: 1.5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-group h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .title-group p {
            margin: 4px 0 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .controls button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls button:hover {
            background-color: var(--accent-hover);
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #111827;
            text-align: left;
            padding: 12px 16px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .guard-id {
            font-family: 'Courier New', monospace;
            color: var(--accent);
        }

        .explanation {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .bar-container {
            width: 120px;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Status Colors */
        .HIGH .bar-fill,
        .tag.HIGH {
            background: var(--success);
            color: #000;
        }

        .MEDIUM .bar-fill,
        .tag.MEDIUM {
            background: var(--warning);
            color: #000;
        }

        .LOW .bar-fill,
        .tag.LOW {
            background: var(--danger);
            color: #fff;
        }

        .HIGH .tag.HIGH {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .MEDIUM .tag.MEDIUM {
            background: rgba(234, 179, 8, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .LOW .tag.LOW {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .empty-state {
            padding: 48px;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Controls UI Enhancements */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input[type="file"] {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 12px;
            transition: all 0.2s;
            

            /* file-selector-button {
                color: var(--text-primary);
                border: 1px solid var(--border-color);
                padding: 6px 12px;
                border-radius: 6px;
                cursor: pointer;
                margin-right: 12px;
                transition: all 0.2s;
            }

            file-selector-button:hover {
                border-color: var(--accent);
                background: var(--bg-dark);
            } */
        }

        select {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="title-group">
            <h1>OnionTrace Analysis</h1>
            <p id="meta">Network Forensics Intelligence Dashboard</p>
        </div>
        <div class="controls">
            <button id="export">
                <span>Download Report</span>
            </button>
            <input type="file" id="pcap" accept=".pcap" />

            <select id="mode">
                <option value="simulation">Simulation</option>
                <option value="realtime">Real-time (Dev)</option>
            </select>

            <button id="analyze">Analyze</button>

        </div>
    </div>

    <div class="card">
        <table id="results">
            <thead>
                <tr>
                    <th width="20%">Guard Identify (Base64)</th>
                    <th width="15%">Confidence</th>
                    <th width="10%">Score</th>
                    <th width="10%">Level</th>
                    <th width="45%">Forensic Reasoning</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Rows injected by renderer.js -->
            </tbody>
        </table>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
